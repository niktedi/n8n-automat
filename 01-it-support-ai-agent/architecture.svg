<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="724" viewBox="0 0 1040 724" role="img" aria-label="The model only chooses a tool and a short argument; every tool passes a boundary enforced outside the model before it reaches the server, a service, the database or GitHub.">
  <title>IT support AI agent: request path and security boundaries</title>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1A2C45"/>
    </pattern>
    <linearGradient id="agentFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F3366"/>
      <stop offset="1" stop-color="#16264A"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#6E86AB"/>
    </marker>
    <style>
      text   { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
      .panel { fill: #13243B; stroke: #2B4163; stroke-width: 1.25; }
      .sys   { fill: #0F1E32; stroke: #2B4163; stroke-width: 1.25; }
      .agent { fill: url(#agentFill); stroke: #8AA8FF; stroke-width: 2; }
      .guard { fill: #1D2233; stroke: #F0B44C; stroke-width: 1.5; }
      .gate  { fill: #1D2233; stroke: #F0B44C; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .wire  { stroke: #6E86AB; stroke-width: 1.5; fill: none; }
      .chip  { fill: #0D1A2B; stroke: #3A5378; stroke-width: 1; }
      .t     { fill: #E8EEF7; font-size: 15px; font-weight: 600; text-anchor: middle; }
      .ta    { fill: #FFFFFF; font-size: 17px; font-weight: 600; text-anchor: middle; }
      .tg    { fill: #F6D08D; font-size: 14.5px; font-weight: 600; text-anchor: middle; }
      .s     { fill: #91A3BF; font-size: 13px; text-anchor: middle; }
      .sa    { fill: #B9CBFF; font-size: 13px; text-anchor: middle; }
      .code  { fill: #E8EEF7; font-size: 14px; text-anchor: middle; font-family: "Cascadia Code", Consolas, "SF Mono", Menlo, monospace; }
      .c     { fill: #C3D0E3; font-size: 12px; text-anchor: middle; }
      .w     { fill: #91A3BF; font-size: 12px; }
      .zone  { fill: #7F93B3; font-size: 13px; }
      .zoneA { fill: #F0B44C; font-size: 13px; font-weight: 600; }
    </style>
  </defs>

  <!-- ground -->
  <rect width="1040" height="724" rx="16" fill="#0D1A2B"/>
  <rect width="1040" height="724" rx="16" fill="url(#grid)"/>

  <!-- zone dividers -->
  <line x1="24" y1="196" x2="1016" y2="196" stroke="#1F3150" stroke-dasharray="2 6"/>

  <!-- the fence: everything that crosses it is checked outside the model -->
  <rect x="0" y="470" width="1040" height="108" fill="#F0B44C" fill-opacity="0.07"/>
  <line x1="0" y1="470" x2="1040" y2="470" stroke="#F0B44C" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <line x1="0" y1="578" x2="1040" y2="578" stroke="#F0B44C" stroke-opacity="0.55" stroke-dasharray="8 6"/>

  <!-- zone labels -->
  <text class="zone" x="32" y="104">Telegram</text>
  <text class="zone" x="32" y="318">Decided by</text>
  <text class="zone" x="32" y="336">the model</text>
  <text class="zoneA" x="32" y="507">Enforced</text>
  <text class="zoneA" x="32" y="525">outside</text>
  <text class="zoneA" x="32" y="543">the model</text>
  <text class="zone" x="32" y="660">Server and</text>
  <text class="zone" x="32" y="678">services</text>

  <!-- user -->
  <rect class="panel" x="488" y="38" width="220" height="44" rx="22"/>
  <text class="t" x="598" y="65">User in Telegram</text>

  <!-- chat allowlist -->
  <line class="wire" x1="598" y1="82" x2="598" y2="114" marker-end="url(#arrow)"/>
  <text class="w" x="608" y="103">message</text>
  <rect class="gate" x="448" y="116" width="300" height="56" rx="10"/>
  <text class="tg" x="598" y="140">Telegram Trigger</text>
  <text class="s" x="598" y="160">only allowed chat IDs pass</text>

  <!-- agent -->
  <line class="wire" x1="598" y1="172" x2="598" y2="210" marker-end="url(#arrow)"/>
  <rect class="agent" x="448" y="212" width="300" height="78" rx="14"/>
  <text class="ta" x="598" y="245">AI Agent</text>
  <text class="sa" x="598" y="268">LLM via OpenRouter</text>

  <!-- memory -->
  <line class="wire" x1="750" y1="251" x2="820" y2="251" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="w" x="785" y="242" text-anchor="middle">history</text>
  <rect class="sys" x="822" y="221" width="194" height="60" rx="10"/>
  <text class="t" x="919" y="246">Chat memory</text>
  <text class="s" x="919" y="266">Postgres, per chat</text>

  <!-- reply path -->
  <line class="wire" x1="446" y1="251" x2="376" y2="251" marker-end="url(#arrow)"/>
  <text class="w" x="411" y="242" text-anchor="middle">answer</text>
  <rect class="panel" x="180" y="221" width="194" height="60" rx="10"/>
  <text class="t" x="277" y="246">Format for Telegram</text>
  <text class="s" x="277" y="266">Markdown → safe HTML</text>
  <path class="wire" d="M277,219 V60 H484" marker-end="url(#arrow)"/>
  <text class="w" x="287" y="140">reply</text>

  <!-- fan-out to tools -->
  <line class="wire" x1="598" y1="290" x2="598" y2="316"/>
  <line class="wire" x1="277" y1="316" x2="919" y2="316"/>
  <line class="wire" x1="277" y1="316" x2="277" y2="340" marker-end="url(#arrow)"/>
  <line class="wire" x1="491" y1="316" x2="491" y2="340" marker-end="url(#arrow)"/>
  <line class="wire" x1="705" y1="316" x2="705" y2="340" marker-end="url(#arrow)"/>
  <line class="wire" x1="919" y1="316" x2="919" y2="340" marker-end="url(#arrow)"/>
  <circle cx="598" cy="316" r="3" fill="#6E86AB"/>

  <!-- tools -->
  <rect class="panel" x="180" y="342" width="194" height="82" rx="10"/>
  <text class="code" x="277" y="368">server_status</text>
  <text class="code" x="277" y="389">disk_usage</text>
  <text class="code" x="277" y="410">container_logs</text>

  <rect class="panel" x="394" y="342" width="194" height="82" rx="10"/>
  <text class="code" x="491" y="377">check_service</text>
  <text class="s" x="491" y="399">is it reachable?</text>

  <rect class="panel" x="608" y="342" width="194" height="82" rx="10"/>
  <text class="code" x="705" y="377">search_kb</text>
  <text class="s" x="705" y="399">what to do about it</text>

  <rect class="panel" x="822" y="342" width="194" height="82" rx="10"/>
  <text class="code" x="919" y="377">create_issue</text>
  <text class="s" x="919" y="399">ticket for the admin</text>

  <!-- what the model sends across the fence -->
  <line class="wire" x1="277" y1="424" x2="277" y2="484" marker-end="url(#arrow)"/>
  <line class="wire" x1="491" y1="424" x2="491" y2="484" marker-end="url(#arrow)"/>
  <line class="wire" x1="705" y1="424" x2="705" y2="484" marker-end="url(#arrow)"/>
  <line class="wire" x1="919" y1="424" x2="919" y2="484" marker-end="url(#arrow)"/>

  <rect class="chip" x="182" y="440" width="190" height="22" rx="11"/>
  <text class="c" x="277" y="455">status | disk | logs &lt;name&gt;</text>
  <rect class="chip" x="436" y="440" width="110" height="22" rx="11"/>
  <text class="c" x="491" y="455">service name</text>
  <rect class="chip" x="660" y="440" width="90" height="22" rx="11"/>
  <text class="c" x="705" y="455">keywords</text>
  <rect class="chip" x="871" y="440" width="96" height="22" rx="11"/>
  <text class="c" x="919" y="455">title, body</text>

  <!-- guards -->
  <rect class="guard" x="180" y="486" width="194" height="76" rx="8"/>
  <text class="tg" x="277" y="517">SSH forced command</text>
  <text class="s" x="277" y="538">allowlist, audit log</text>

  <rect class="guard" x="394" y="486" width="194" height="76" rx="8"/>
  <text class="tg" x="491" y="517">Name → URL lookup</text>
  <text class="s" x="491" y="538">URLs live in Config</text>

  <rect class="guard" x="608" y="486" width="194" height="76" rx="8"/>
  <text class="tg" x="705" y="517">Parameterised SQL</text>
  <text class="s" x="705" y="538">text in, never code</text>

  <rect class="guard" x="822" y="486" width="194" height="76" rx="8"/>
  <text class="tg" x="919" y="517">Fixed repo and label</text>
  <text class="s" x="919" y="538">agent asks user first</text>

  <!-- what actually runs -->
  <line class="wire" x1="277" y1="562" x2="277" y2="632" marker-end="url(#arrow)"/>
  <line class="wire" x1="491" y1="562" x2="491" y2="632" marker-end="url(#arrow)"/>
  <line class="wire" x1="705" y1="562" x2="705" y2="632" marker-end="url(#arrow)"/>
  <line class="wire" x1="919" y1="562" x2="919" y2="632" marker-end="url(#arrow)"/>

  <rect class="chip" x="194" y="594" width="166" height="22" rx="11"/>
  <text class="c" x="277" y="609">docker ps, df, docker logs</text>
  <rect class="chip" x="426" y="594" width="130" height="22" rx="11"/>
  <text class="c" x="491" y="609">GET /healthz, 5 s</text>
  <rect class="chip" x="640" y="594" width="130" height="22" rx="11"/>
  <text class="c" x="705" y="609">full-text, top 3</text>
  <rect class="chip" x="858" y="594" width="122" height="22" rx="11"/>
  <text class="c" x="919" y="609">new issue + label</text>

  <!-- targets -->
  <rect class="sys" x="180" y="634" width="194" height="62" rx="10"/>
  <text class="t" x="277" y="660">Docker on the host</text>
  <text class="s" x="277" y="680">via SSH sub-workflow</text>

  <rect class="sys" x="394" y="634" width="194" height="62" rx="10"/>
  <text class="t" x="491" y="660">Service health</text>
  <text class="s" x="491" y="680">n8n-prod, n8n-dev</text>

  <rect class="sys" x="608" y="634" width="194" height="62" rx="10"/>
  <text class="t" x="705" y="660">Knowledge base</text>
  <text class="s" x="705" y="680">Postgres kb.articles</text>

  <rect class="sys" x="822" y="634" width="194" height="62" rx="10"/>
  <text class="t" x="919" y="660">GitHub issues</text>
  <text class="s" x="919" y="680">private repo</text>
</svg>
