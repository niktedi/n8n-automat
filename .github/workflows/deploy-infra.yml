name: Deploy infra · shared workflows

# Shared n8n workflows (error-alerts) used by every scenario.
# Deploy this before a scenario that references them by ID.
on:
  push:
    branches: [main]
    paths:
      - "infra/*.workflow.json"
      - ".github/workflows/deploy-infra.yml"
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-scenario.yml
    with:
      scenario: infra
    secrets: inherit
