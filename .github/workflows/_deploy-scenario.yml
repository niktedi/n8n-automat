name: Deploy scenario (reusable)

# Shared deploy logic. Each deploy-NN-*.yml calls this with its folder name.
on:
  workflow_call:
    inputs:
      scenario:
        description: 00-telegram-smoke-bot
        required: true
        type: string

# One deploy at a time: each deploy restarts n8n
concurrency:
  group: n8n-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  N8N_CONTAINER: n8n-stack-n8n-1

jobs:
  deploy:
    name: Deploy ${{ inputs.scenario }}
    runs-on: [self-hosted, vps]
    steps:
      - uses: actions/checkout@v4

      - name: Validate workflows
        run: python3 scripts/check_workflows.py

      # Workflows are exported from dev; credential IDs differ in prod.
      # Read prod credential names/types/IDs (encrypted export: no secrets leave n8n).
      - name: Read prod credentials list
        run: |
          docker exec -u node "$N8N_CONTAINER" n8n export:credentials --all --output=/tmp/deploy-creds.json
          docker exec -u node "$N8N_CONTAINER" cat /tmp/deploy-creds.json \
            | python3 -c "import json,sys; print(json.dumps([{k: c[k] for k in ('id','name','type')} for c in json.load(sys.stdin)]))" \
            > "$RUNNER_TEMP/creds.json"
          docker exec -u node "$N8N_CONTAINER" rm -f /tmp/deploy-creds.json

      # Sub-workflows (*.workflow.json) first: the main workflow calls them by ID
      - name: Render, import and publish workflows
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("${{ inputs.scenario }}"/*.workflow.json "${{ inputs.scenario }}/workflow.json")
          for f in "${files[@]}"; do
            echo "::group::$f"
            ID=$(python3 scripts/render_workflow.py "$f" "$RUNNER_TEMP/render.json" "$RUNNER_TEMP/creds.json")
            docker exec -i -u node "$N8N_CONTAINER" sh -c 'cat > /tmp/deploy-workflow.json' < "$RUNNER_TEMP/render.json"
            docker exec -u node "$N8N_CONTAINER" n8n import:workflow --input=/tmp/deploy-workflow.json
            docker exec -u node "$N8N_CONTAINER" n8n publish:workflow --id="$ID"
            docker exec -u node "$N8N_CONTAINER" rm -f /tmp/deploy-workflow.json
            rm -f "$RUNNER_TEMP/render.json"
            echo "::endgroup::"
          done

      # CLI publish takes effect only after a restart (n8n docs)
      - name: Restart n8n
        run: docker restart "$N8N_CONTAINER"

      - name: Wait for n8n to be healthy
        run: |
          for i in $(seq 1 30); do
            if docker exec "$N8N_CONTAINER" node -e "fetch('http://localhost:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" 2>/dev/null; then
              echo "n8n is up"; exit 0
            fi
            sleep 2
          done
          echo "n8n did not become healthy in 60 s" >&2
          docker logs --tail 50 "$N8N_CONTAINER"
          exit 1

      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/render.json" "$RUNNER_TEMP/creds.json"
        
